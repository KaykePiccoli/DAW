<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JS e PHP</title>
</head>
<body>

    <div class="calculadora">
        <h2>Calculadora</h2>
        <form id="form-calc">
            <input type="number" id="num1" placeholder="Digite o 1 numero" step="any" required>
            
            <select id="operacao" required>
                <option value="soma">Somar (+)</option>
                <option value="subtracao">Subtrair (-)</option>
                <option value="multiplicacao">Multiplicar (*)</option>
                <option value="divisao">Dividir (/)</option>
            </select>
            
            <input type="number" id="num2" placeholder="Digite o 2 nmero" step="any" required>
            
            <button type="submit">Calcular</button>
        </form>

        <div id="resultado-tela"></div>
    </div>

    <script>
        document.getElementById('form-calc').addEventListener('submit', function(event) {
            event.preventDefault(); //impede a pagina de recarregar

            // pega os valores
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operacao = document.getElementById('operacao').value;
            const telaResultado = document.getElementById('resultado-tela');

            // formata em objeto
            const dadosRequisicao = {
                num1: parseFloat(num1),
                num2: parseFloat(num2),
                operacao: operacao
            };

            // requisicao http para o php
            fetch('calculadora.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // avisa que ta em json
                },
                body: JSON.stringify(dadosRequisicao) // converte objeto de javascript para string json
            })
            .then(response => response.json()) // transforma o json recebido do php de volta em js
            .then(dadosResposta => {

                // da print la no html
                if (dadosResposta.erro) {
                    telaResultado.style.color = 'red';
                    telaResultado.innerText = dadosResposta.erro;
                } else {
                    telaResultado.style.color = '#28a745';
                    telaResultado.innerText = "Resultado: " + dadosResposta.resultado;
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                telaResultado.style.color = 'red';
                telaResultado.innerText = "Erro ao processar a requisição.";
            });
        });
    </script>

</body>
</html>
